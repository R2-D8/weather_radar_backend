[project]
name = "weather-radar"
version = "0.1.0"
description = "Radar tile server: ingests Italian DPC rain-rate frames and serves map tiles."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "numpy>=2.0",
    "pyproj>=3.6",
    "Pillow>=10.4",
    # Optical flow and image warping for the short rain forecast (headless: no GUI libraries).
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyproj", "pyproj.*"]
ignore_missing_imports = true
